# =============================================================================
# 前端 Nginx 配置
#
# 干两件事：
#   1. 托管 vite 打出来的静态文件
#   2. 把 /api/ 的请求转发给后端容器（server:3000）
#
# 注意：
#   前端用的是 hash 路由（地址栏带 #），所以服务器不需要为路由做 fallback。
#   下面 location / 里的 try_files 是兜底，去掉也能跑。
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（表格里有附件字段时可能需要调大）
    client_max_body_size 20m;

    # 静态资源：文件名带 hash，可以放心长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 接口反向代理
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 动态表格查询可能慢一点，超时给到 60 秒
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查：curl http://IP:8080/healthz 返回 ok 就说明 nginx 活着
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
