# =============================================================================
# 一键起「数据库 + 后端 + 前端」，用于本地联调和服务器部署
#
# 用法（在项目根目录，也就是这个文件所在目录）：
#   1. cp .env.example .env   然后改里面的 JWT_SECRET 和数据库密码
#   2. docker compose up -d --build
#   3. 打开 http://服务器IP:8090
#
# 注意：
#   - db 用了 pgvector/pgvector:pg16 镜像，扩展才可用（普通 postgres 镜像要自己装）
#   - db 端口映射到宿主机 5434（不是 5432），避免和本机已有的 PostgreSQL 撞端口
#   - 后端容器启动时只做 `prisma migrate deploy`；种子数据（超管账号）需要手动跑一次：
#       docker compose exec server npm run seed
#     这是有意的：自动跑种子会让「不小心重启」变成「每次重启都动一次数据」
# =============================================================================

services:
  # ---------- 数据库：PostgreSQL 16 + pgvector 扩展 ----------
  db:
    image: pgvector/pgvector:pg16
    container_name: bmf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmf_password}
      POSTGRES_DB: ${POSTGRES_DB:-bmf}
      # 初始化时把时区设成东八区，查出来的时间不用再换算
      TZ: Asia/Shanghai
    ports:
      # 只绑本机回环，外部访问不到数据库；本地开发用 127.0.0.1:5434 连
      - "127.0.0.1:5434:5432"
    volumes:
      - bmf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmf} -d ${POSTGRES_DB:-bmf}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------- 后端：NestJS + Prisma ----------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bmf-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bmf}:${POSTGRES_PASSWORD:-bmf_password}@db:5432/${POSTGRES_DB:-bmf}?schema=public
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 里设置 JWT_SECRET（不要用默认值）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-yy1}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-yy1129273677}
      TZ: Asia/Shanghai
    # 不把 3000 端口暴露到公网：前端 Nginx 走容器内网转发 /api
    expose:
      - "3000"

  # ---------- 前端：Vite 构建 + Nginx 静态托管 + 反向代理 /api ----------
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bmf-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8090:80"
    environment:
      TZ: Asia/Shanghai

volumes:
  bmf-pgdata:
